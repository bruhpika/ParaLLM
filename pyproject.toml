[project]
name = "pybamm-closed-loop"
version = "0.1.0"
description = "Closed-loop LLM framework for physics-based battery parameterization (research prototype)"
requires-python = ">=3.10,<3.16"
dependencies = [
    "pybamm==26.8.0.0",
    "numpy>=2,<3",
    "scipy>=1.13",
    "pandas>=2",
    "pydantic>=2.7",
    "PyYAML>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that build and run PyBaMM simulations",
    "slow: tests that take more than a few seconds",
    "benchmark: scientific performance benchmarks (excluded from default runs)",
]
addopts = "-m 'not benchmark'"
