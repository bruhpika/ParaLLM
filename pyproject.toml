[project]
name = "parallm-pybamm"
version = "0.1.0b1"
description = "PARALLM: LLM-assisted, provenance-grounded parameterization for PyBaMM (research beta; parameters — not a problem anymore)"
requires-python = ">=3.10,<3.16"
authors = [{name = "Harshith Bhardwaz Kenkary", email = "harshithkenkary@gmail.com"}]
dependencies = [
    "pybamm==26.8.0.0",
    "numpy>=2,<3",
    "scipy>=1.13",
    "pandas>=2",
    "pydantic>=2.7",
    "PyYAML>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Ecosystem integration stack. Verified together on CPython 3.12.16 with
# PyBaMM 26.8.0.0 (requirements/ecosystem-py312.lock). Bounds cap at majors
# verified in that environment: pypdf 7.x and polars 2.x are NOT covered.
# Deliberately not listed (transitive): cma (via pints), scikit-learn and
# fastexcel (via PyProBE-Data). numpy/scipy/pandas come from dependencies.
ecosystem = [
    "pybop>=26.10,<27",
    "pints>=0.6.1,<0.7",
    "SALib>=1.6,<2",
    "pypdf>=6.21,<7",
    "polars>=1.44,<2",
    "PyProBE-Data>=2.6.1,<3 ; python_version < '3.13'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that build and run PyBaMM simulations",
    "slow: tests that take more than a few seconds",
    "benchmark: scientific performance benchmarks (excluded from default runs)",
]
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".venv-*", "*.egg-info", "data", "results"]

[tool.ruff.lint]
# Minimal permissive set: fatal syntax errors (E9) and pyflakes (F).
# Cosmetic/formatting rules intentionally left off; ruff has no
# duplicate-code rule to disable.
select = ["E9", "F"]

[project.urls]
Homepage = "https://github.com/bruhpika/ParaLLM-PyBaMM"
Repository = "https://github.com/bruhpika/ParaLLM-PyBaMM"
Issues = "https://github.com/bruhpika/ParaLLM-PyBaMM/issues"
