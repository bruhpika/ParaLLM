# TASK 1/2: single-condition synthetic recovery of electrode volume fractions
# Demonstrator: DFN + Chen2020 (LG M50), 1C discharge window.
run_id: recovery_volume_fractions_single_1C
description: >
  Synthetic parameter recovery benchmark. Ground-truth values are the Chen2020
  parameter-set values. Observations are generated by the same model that is
  fitted (method check only, NOT experimental validation).

model_name: DFN
parameter_set: Chen2020

true_values:
  Negative electrode active material volume fraction: 0.75
  Positive electrode active material volume fraction: 0.665

fit_parameters:
  - name: Negative electrode active material volume fraction
    initial_value: 0.62
    bounds: [0.55, 0.90]
  - name: Positive electrode active material volume fraction
    initial_value: 0.55
    bounds: [0.45, 0.80]

# Multi-start: each row is one initial guess [neg, pos]; all are reported.
multi_start:
  - [0.62, 0.55]
  - [0.85, 0.60]
  - [0.70, 0.75]

conditions:
  - name: "1C"
    steps: ["Discharge at 1C for 900 s"]

noise_sigma_V: 0.002
seed: 20261104

cost: SumSquaredError
optimizer:
  method: L-BFGS-B
  maxiter: 100
  jac: true
